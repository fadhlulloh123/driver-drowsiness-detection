<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Drowsiness Detection</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
  <h1>Driver Drowsiness Detection</h1>

  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>

  <div class="info">
    <p>Status: <span id="status">NORMAL</span></p>
    <p>Eyes closed: <span id="eyeTimer">0.0</span> detik</p>
    <p>Blink count: <span id="blinkCount">0</span></p>
    <p>Yawn count: <span id="yawnCount">0</span></p>
  </div>

  <div class="control">
    <button id="startBtn">START</button>
    <button id="stopBtn">STOP</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
